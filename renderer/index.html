<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; media-src 'self' http://127.0.0.1:*;">
  <title>Ailune</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #2c2542;
      --panel: rgba(27, 23, 46, 0.88);
      --panel-border: rgba(203, 189, 255, 0.28);
      --accent: #ff9ac1;
      --accent-soft: rgba(255, 154, 193, 0.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Noto Sans", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body { cursor: default; }
    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 420px;
      height: 420px;
      transform-origin: top left;
      cursor: grab;
      touch-action: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    #stage.visible { opacity: 1; }
    #stage.dragging { cursor: grabbing; }
    #character { display: block; width: 100%; height: 100%; }
    #bubble {
      position: absolute;
      max-width: 280px;
      min-width: 90px;
      padding: 11px 15px;
      border-radius: 16px 16px 16px 5px;
      background: rgba(30, 25, 48, 0.9);
      border: 1px solid rgba(224, 210, 255, 0.35);
      color: #f7f2ff;
      font-size: 13.5px;
      line-height: 1.5;
      box-shadow: 0 10px 34px rgba(12, 8, 30, 0.32);
      backdrop-filter: blur(10px);
      pointer-events: none;
      opacity: 1;
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 20;
      word-break: break-word;
    }
    #bubble.hidden {
      opacity: 0;
      transform: translateY(5px);
    }
    #bubble::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: -7px;
      width: 13px;
      height: 13px;
      background: rgba(30, 25, 48, 0.9);
      border-right: 1px solid rgba(224, 210, 255, 0.22);
      border-bottom: 1px solid rgba(224, 210, 255, 0.22);
      transform: rotate(45deg);
    }
    #menu {
      position: absolute;
      min-width: 172px;
      padding: 6px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 48px rgba(9, 5, 24, 0.45);
      backdrop-filter: blur(14px);
      color: #f0ebff;
      font-size: 13px;
      z-index: 30;
      opacity: 1;
      transform-origin: top left;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    #menu.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    #menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    #menu button:hover, #menu button:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }
    #menu button .icon {
      width: 18px;
      text-align: center;
      color: #d8c9ff;
    }
    #menu .sep {
      height: 1px;
      margin: 5px 8px;
      background: rgba(216, 201, 255, 0.14);
    }
    #menu .danger { color: #ffb3c7; }
    .bubble-name {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ffc4dc;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Ailune desktop companion">
    <canvas id="character" width="420" height="420"></canvas>
  </div>
  <div id="bubble" class="hidden" role="status" aria-live="polite"></div>
  <div id="menu" class="hidden" role="menu"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
